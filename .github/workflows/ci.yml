name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: table

      # The compiler is whichever commit cancho.toml says these sources were
      # written for: one place, which the compiler itself checks.
      - name: Read the pins from cancho.toml
        id: pin
        run: |
          echo "rev=$(sed -n 's/^cancho *= *"\([0-9a-f]*\)".*/\1/p' table/cancho.toml)" >> "$GITHUB_OUTPUT"
          echo "contract=$(sed -n 's/^rev *= *"\([0-9a-f]*\)".*/\1/p' table/cancho.toml | sort -u)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ steps.pin.outputs.rev }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: Put the compiler on PATH
        run: echo "$GITHUB_WORKSPACE/cancho/target/release" >> "$GITHUB_PATH"

      # The sources the contract package was published from, at the pinned
      # revision: only to check that the package says what they say.
      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho-tools
          ref: ${{ steps.pin.outputs.contract }}
          path: cancho-tools

      - name: What the gates validate with (jsonschema) and trace with (strace)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q strace
          pip install jsonschema duckdb pytz

      - name: Formatting
        working-directory: table
        run: cancho fmt --check tools generated

      # Installs the pinned contract modules into build/deps, then builds.
      - name: Build
        working-directory: table
        run: cancho build

      # The six numeric modules (pow5, dec, flt, cellnum, facc, reader) are published as stores another repository pins (docs/numeric-package.md): a fresh publish with the pinned
      # compiler must give the committed .cancho-vcs byte for byte, and no published module may be the table's plan.
      - name: The committed numeric stores are what the sources publish
        working-directory: table
        run: python3 scripts/publish_numeric.py --check

      # The loop that reads standard input is the loop that reads a file, made mechanically (scripts/stream.py): the file loop is the one whose cost is held to
      # main's, so it is not edited to serve a pipe.
      - name: The read loop for standard input is the file loop's copy
        working-directory: table
        run: python3 scripts/stream.py --check

      - name: Schemas are generated, not edited
        working-directory: table
        run: python3 scripts/schemas.py --check

      - name: The authority is the compiler's (package included), embedded, within its ceiling
        working-directory: table
        run: python3 scripts/manifest.py --check

      - name: The authority from the installed package is the one from cancho-tools' sources
        working-directory: table
        run: python3 scripts/manifest.py --check --against ../cancho-tools/contract

      # The MCP server (docs/mcp.md): its tool definition and its authority row are generated (from `table
      # introspect` and from the compiler), embedded in generated/mcp/tools.cho and manifests/mcp.authority.json,
      # and the row is held within server/ceiling.toml, as the tool's is within tools.toml. The server is built
      # with the directory of this checkout's build/ baked in, as the tests do.
      - name: The MCP server's definition and authority are generated, and within their ceiling
        working-directory: table
        run: python3 scripts/mcp.py --check

      # Every mutant's text must still occur exactly once in the source it mutates (no build, no tests): a mutant
      # that cannot apply fails here, loudly, instead of silently testing nothing.
      - name: The mutants still apply
        working-directory: table
        run: |
          for m in select filter parallel cellcost sort numbers float float_sum typed_keys report mcp skill inputs stdin query explain jsonl jsonl_out or join group rename query_join join_jsonl datetime datetime_bucket datetime_surface groupsort; do python3 scripts/${m}_mutants.py --check; done

      - name: Conformance gates (differential against Python's csv, rules, limits, memory, authority)
        working-directory: table
        run: python3 -W ignore -m unittest discover -s tests/conformance -v

      # The date benchmark script (docs/datetime.md G-NEW-SPEED) only has to keep working here: the numbers are the maintainer's machines'.
      - name: The date benchmark script runs
        working-directory: table
        run: python3 scripts/bench_datetime.py --rows 20000 --runs 1 --no-count --file build/dt/data.csv

      # The README's example and the project pages' terminals, authority row, rules
      # and counts are written from the built binary; this fails if they differ.
      - name: The README and the project pages say what the binary says
        working-directory: table
        run: python3 scripts/site.py --check

      # Title and description lengths, the JSON-LD against the visible text, the demo video's
      # files, size budget, length and date, links, contrast (standard library only).
      - name: The project pages keep their structure and what their metadata states
        run: python3 scripts/seo_check.py
        working-directory: table

      # No csvtk here: this only keeps the script working. The numbers in the
      # README are from a machine that has it.
      - name: The benchmark script runs
        working-directory: table
        run: python3 scripts/bench.py --rows 20000 --runs 1

      # The same, for standard input: no csvtk, duckdb or floor binary here, so only the pipelines of `table` run.
      - name: The standard-input benchmark script runs
        working-directory: table
        run: python3 scripts/bench_stdin.py --rows 20000 --runs 1 --file build/bench/data_stdin.csv

      # --query is the flags it is translated to (docs/query.md, Q1-EQ): every plan of the corpus on the benchmark file this job has, written both ways. The corpus's other files
      # (adversarial, numbers) are the maintainer's machines'; a missing one is reported and skipped here, and required there (--require f1,f2,q,long,wide,num).
      - name: The query form gives the bytes of the flag form on the corpus
        working-directory: table
        run: python3 scripts/query_corpus.py --require f1

      # --explain is the plan said and not run (docs/query.md section 15, X1): the same plans of the corpus, explained as flags and as a query, are the same bytes, and name the columns of
      # the answer the run gives.
      - name: The explain of the flag form is the explain of the query form on the corpus
        working-directory: table
        run: python3 scripts/explain_corpus.py --require f1
