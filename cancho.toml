[package]
name = "table"
cancho = "a4572ea3b506e4bcec1c4be43deda1043c11ba9f"   # the compiler these sources were written for

# `contract` is not a directory here: it is cancho-tools' package, one store per
# module, pinned to a commit. `toolbox.built` is not in the package; it is this
# tool's own generated module (generated/table, written by scripts/manifest.py).

[dependencies.cli]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.cli"

[dependencies.describe]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.describe"

[dependencies.fail]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.fail"

[dependencies.limit]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.limit"

[dependencies.lines]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.lines"

[dependencies.out]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.out"

[dependencies.path]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.path"

[dependencies.place]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.place"

[dependencies.text]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.text"

[[bin]]
name = "table"
sources = ["tools/table", "generated/table"]
std = true
out = "build/table"
